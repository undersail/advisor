name: Sync to Gitee Mirror

# 把 main 分支和 tag 镜像到 Gitee（参考 ezapps 的 sync-gitee.yml）。
#
# 需要在本仓库 Settings → Secrets and variables → Actions 配置：
#   GITEE_DEPLOY_KEY —— Gitee 私人令牌
#       入口：https://gitee.com/profile/personal_access_tokens
#       （头像 → 设置 → 安全设置 → 私人令牌 → 生成新令牌）
#       权限必须勾选 projects，否则 push 会被拒；令牌只显示一次，当场复制。
#
# 目标仓：https://gitee.com/undersail/advisor
#
# ★ 反拉保护：推送前会先读镜像仓（scripts/check-mirror-drift.sh）。
#   只要发现「推上去会覆盖掉 Gitee 侧独有的提交/同名 tag」就**中止同步**并给出
#   反拉步骤 —— 避免 Gitee 上的改动被 --force 无声抹掉。
#   确认那些改动可以丢弃时，用 workflow_dispatch 勾选 force 重跑。
#
#   镜像定位：GitHub 是唯一写入源；Gitee 只读镜像。真在 Gitee 上改了东西，
#   先反拉回来合进 main，再让这里同步回去。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: '跳过反拉保护，允许覆盖 Gitee 侧独有的提交/tag（确认可丢弃才勾）'
        type: boolean
        default: false

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  sync:
    name: 推送到 Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 经 env 传入而不是内联进 run 脚本，避免任何情况下被日志回显
      GITEE_TOKEN: ${{ secrets.GITEE_DEPLOY_KEY }}

    steps:
      - name: 检出代码（完整历史）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查密钥是否已配置
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 GITEE_DEPLOY_KEY。请在 Settings → Secrets and variables → Actions 添加 Gitee 私人令牌（需勾选 projects 权限）。"
            exit 1
          fi
          echo "密钥已配置（长度 ${#GITEE_TOKEN}）"

      - name: 环境信息（失败时便于定位）
        run: |
          echo "源:   ${{ github.repository }} @ ${{ github.ref_name }} ($(git rev-parse --short HEAD))"
          echo "目标: gitee.com/undersail/advisor"
          echo "分支: $(git branch -r | tr -d ' ' | tr '\n' ' ')"
          echo "tag:  $(git tag | wc -l | tr -d ' ') 个"

      - name: 反拉保护（Gitee 侧有我们没的提交就停下）
        if: ${{ github.event_name == 'push' || inputs.force != true }}
        run: |
          set -o pipefail
          # 只读不写：fetch 镜像仓，比较分支与 tag。
          # 退出 2 = 会被覆盖，立刻中止；退出 1 = 读不到镜像，同样不盲目推。
          REMOTE_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/undersail/advisor.git"
          # 显式取退出码：`if cmd; then ...; fi` 在没有分支命中时整体状态是 0，
          # 直接读 $? 会拿到 0，把「漂移」误判成「正常」。
          set +e
          bash scripts/check-mirror-drift.sh "$REMOTE_URL" --branch main
          code=$?
          set -e
          [ "$code" = 0 ] && exit 0
          sed -i "s|${GITEE_TOKEN}|***|g" /tmp/advisor-mirror-fetch.log 2>/dev/null || true
          if [ "$code" = 2 ]; then
            echo "::error::Gitee 镜像上有 GitHub 没有的提交/tag，强推会覆盖它们。已中止同步。按上方提示反拉回 main（cherry-pick 或 merge）后再推；补丁等价时守卫会自动放行。确认可丢弃则手动触发并勾选 force。"
          else
            echo "::error::读不到 Gitee 镜像（网络或凭据），为避免盲目强推已中止。"
          fi
          exit 1

      - name: 推送到 Gitee 镜像
        run: |
          set -o pipefail
          TARGET="gitee.com/undersail/advisor.git"

          # Gitee 同时支持 oauth2:<令牌> 与 <用户名>:<令牌> 两种 basic auth 形式，
          # 但不同账号/时期行为不一，这里先试 oauth2 再回退，免得同步静默失败。
          try_push() {
            local prefix="$1" label="$2"
            local remote="https://${prefix}:${GITEE_TOKEN}@${TARGET}"
            if git push "$remote" --all --force 2>&1 | tee /tmp/push.log; then
              echo "::notice::分支推送成功（凭据形式 ${label}）"
              return 0
            fi
            # 令牌可能被 git 回显进错误信息，打码后再报
            sed -i "s|${GITEE_TOKEN}|***|g" /tmp/push.log
            return 1
          }

          if try_push "oauth2" "oauth2:<令牌>"; then
            exit 0
          fi
          echo "::warning::oauth2:<令牌> 形式失败，改用 <用户名>:<令牌> 形式重试"
          if try_push "undersail" "undersail:<令牌>"; then
            exit 0
          fi

          echo "::error::两种凭据形式都失败（上方日志为真实报错，令牌已打码）"
          cat /tmp/push.log
          exit 1

      - name: 推送 tag
        run: |
          set -o pipefail
          REMOTE="https://oauth2:${GITEE_TOKEN}@gitee.com/undersail/advisor.git"
          # tag 单独推：--all 不含 tag；镜像仓里已有的旧 tag 也一并覆盖
          if git push "$REMOTE" --tags --force 2>&1 | tee /tmp/push-tags.log; then
            echo "::notice::tag 推送成功"
          else
            sed -i "s|${GITEE_TOKEN}|***|g" /tmp/push-tags.log
            # tag 失败不判死：主分支已经同步成功，tag 可以手动补
            echo "::warning::tag 推送失败（分支已同步，tag 未同步）"
            cat /tmp/push-tags.log
          fi
