name: CI

# advisor 的 CI 只做"语法/一致性/启动"三件事，不跑真实 API 调用（需要密钥且计费）。
# 真实目标机是 macOS（Snow Leopard ~ High Sierra 的系统 perl / python3），
# 因此矩阵里同时包含 ubuntu（快速反馈）与 macos（贴近真实目标）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ★ 超时要按平台分开：GitHub 的 macOS runner 排队 10~30 分钟是常态，
    #   而 timeout-minutes 把**排队时间也算在内**。统一写 10 分钟的话，
    #   macOS 腿经常还没分配到机器就被取消 —— run 显示成红，其实一条都没跑
    #   （实测：created 15:52:45 → cancelled 16:07:46，一步未执行）。
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 环境信息（失败时便于定位）
        run: |
          echo "runner:   ${{ matrix.os }}"
          echo "perl:     $(perl -v | grep -oE 'v5\.[0-9]+\.[0-9]+' | head -1)"
          echo "python3:  $(python3 -V 2>&1)"
          echo "bash:     $(bash --version | head -1)"
          echo "curl:     $(curl --version | head -1)"
          echo "openssl:  $(openssl version)"
          echo "--- 仓库现状 ---"
          echo "commit:   $(git rev-parse --short HEAD)"
          echo "files:    $(git ls-files | wc -l | tr -d ' ')"

      # ---------- 1. Perl 智能体本体 ----------
      - name: Perl 语法检查（agent/claude-agent.pl）
        run: |
          set -o pipefail
          # 目标是零 CPAN 依赖的单文件，因此必须在裸 perl 下通过
          perl -c agent/claude-agent.pl 2>&1 | tee /tmp/perl-c.log
          grep -q "syntax OK" /tmp/perl-c.log || {
            echo "::error::perl -c 未返回 syntax OK（上方为真实报错）"
            exit 1
          }

      - name: Perl 冒烟测试（--version）
        run: |
          set -o pipefail
          OUT=$(perl agent/claude-agent.pl --version 2>&1 || true)
          echo "输出: $OUT"
          echo "$OUT" | grep -q "advisor" || {
            echo "::error::--version 未输出 advisor 标识"
            exit 1
          }

      # ---------- 2. GUI ----------
      - name: Python 语法检查（gui/advisor_gui.py）
        run: |
          set -o pipefail
          # 只编译不执行：CI 无显示器，且 tkinter 在 macOS runner 上不一定带。
          # 除了 GUI，scripts/ 下的脚本也要过一遍 —— 不在 CI 里跑的脚本
          # （live-check.py）平时没有任何机会暴露语法错误。
          python3 -m py_compile gui/advisor_gui.py && echo "GUI 语法 OK"
          python3 -m py_compile scripts/*.py && echo "scripts/*.py 语法 OK"

      # ---------- 3. Shell 脚本 ----------
      - name: Shell 语法检查
        run: |
          set -o pipefail
          # 覆盖全仓 shell：漏掉一个就等于那个脚本的语法问题要等真跑起来才发现
          # （scripts/hooks/pre-commit 是 git 每次提交都会执行的，最不能漏）
          FILES="setup.sh completion/advisor-completion.bash release/build_standalone_app.sh scripts/hooks/pre-commit"
          for f in scripts/*.sh; do FILES="$FILES $f"; done
          for f in $FILES; do
            [ -f "$f" ] || { echo "::error::找不到 $f（清单写错了？）"; exit 1; }
            echo "--- $f ---"
            bash -n "$f" || { echo "::error::$f 语法错误"; exit 1; }
          done
          echo "全部 shell 脚本语法 OK（$FILES）"

      # ---------- 4. models.txt 格式卡口 ----------
      - name: models.txt 格式校验
        run: |
          set -o pipefail
          # 约定：<model_id>|<日本語>|<English>|<中文>|<provider>|<base_url>|[flags]
          # 只有前两列必需；第 3 列起可省（向后兼容老的三列表）。
          # 写了哪一列，那一列就不能是空的。
          # provider/base_url/flags 的业务校验交给 scripts/check-models.py。
          FAIL=0
          N=0
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue;; esac
            N=$((N + 1))
            NF=$(printf '%s' "$line" | awk -F'|' '{print NF}')
            if [ "$NF" -lt 2 ] || [ "$NF" -gt 7 ]; then
              echo "::error::第 ${N} 条列数为 ${NF}，应在 2~7 之间：$line"
              FAIL=1
              continue
            fi
            i=3
            while [ "$i" -le "$NF" ]; do
              if [ -z "$(printf '%s' "$line" | awk -F'|' -v i="$i" '{print $i}')" ]; then
                # 第 6 列(base_url)对 anthropic/gemini 允许为空，交给 check-models.py 判断
                if [ "$i" -ne 6 ]; then
                  echo "::error::第 ${N} 条第 ${i} 列是空的：$line"
                  FAIL=1
                fi
              fi
              i=$((i + 1))
            done
          done < models.txt
          echo "有效模型条目: $N"
          [ "$N" -ge 1 ] || { echo "::error::models.txt 里没有可用模型"; exit 1; }
          [ "$FAIL" -eq 0 ] || exit 1

      # ---------- 4b. models.txt 与注册表一致性 ----------
      - name: models.txt 与注册表一致性
        run: python3 scripts/check-models.py

      # ---------- 5. 三语文案占位符一致性 ----------
      - name: 三语文案占位符卡口
        run: python3 scripts/check-i18n.py

      # ---------- 6. 编码/换行卡口 ----------
      - name: Perl 语法检查（remote/）
        run: |
          set -o pipefail
          for f in remote/gateway.pl remote/notify.pl remote/platform.pl; do
            echo "--- $f ---"
            perl -c "$f" || { echo "::error::$f 语法错误"; exit 1; }
          done

      - name: 远程与本地解耦卡口
        run: |
          set -o pipefail
          # 远程能力只能靠核心的「--tools 收窄」实现；核心里出现远程分支就红。
          python3 scripts/check-decoupling.py

      - name: 远程端到端测试（假模型 + 假 webhook）
        run: |
          set -o pipefail
          # 不碰真网络、不碰真 key：本地起假端点，真跑 gateway。
          python3 scripts/test-remote.py

      - name: 中继端到端测试（假中继，同契约）
        run: |
          set -o pipefail
          # 真 Worker 要 wrangler 与账号，CI 里只跑同契约的本地假中继。
          python3 scripts/test-relay.py

      - name: 交互模式端到端（default / accept-edits / bypass）
        run: |
          set -o pipefail
          # 不要真 key：起一个假的 OpenAI 兼容端点喂 tool_call，走 --rpc 断言
          # 「问没问 / 批没批 / 拒得对不对」。危险命令的 fail-closed 只有无人应答
          # 时才出现，终端里造不出来 —— 这也是必须走 rpc 的原因。
          python3 scripts/test-modes.py

      - name: GUI 模式控件（窗口内省，需 Xvfb）
        run: |
          set -o pipefail
          # 徽标/菜单这类东西只有把窗口建起来才验得到。没有 Xvfb 就跳过，
          # 不让它变成 macOS 上的假红。
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a python3 scripts/test-gui-modes.py
          else
            echo "::notice::没有 xvfb-run，跳过 GUI 窗口内省"
          fi

      - name: GUI 静态检查（自递归 = 某平台启动即崩）
        run: |
          set -o pipefail
          # `return f()` 这种自递归在 Linux 上永远走不到，macOS 上却是启动即崩。
          python3 scripts/test-gui-recursion.py

      - name: 镜像反拉保护测试（本地裸仓模拟 Gitee）
        run: |
          set -o pipefail
          # Gitee 镜像用 --force 同步。保护逻辑漏判 = 别人在 Gitee 上的提交被无声覆盖；
          # 过度敏感 = 正常同步一直被卡。两种错都靠本地造场景验。
          python3 scripts/test-mirror-drift.py


      - name: 变量粘连中文检查（bash 3.2 会吞掉变量名）
        run: |
          python3 scripts/check-shell-var-glue.py

      - name: git hook 测试（真的 commit 一次，验证拦截有效）
        run: |
          set -o pipefail
          # hook 最坑的形态是「装了但没生效」，所以这里在临时仓库里真提交：
          # 该拦的（本机路径 / key / CRLF / 调试残留）必须拦住，干净的必须能过。
          python3 scripts/test-hooks.py

      - name: setup.sh 的 python3 探测与 GUI 前置条件
        run: |
          set -o pipefail
          # 回归防线：曾经把「不存在的 /usr/bin/python3」当兜底选中，
          # 装出来的 Advisor.app 双击必然失败，而 setup.sh 还显示一切正常。
          python3 scripts/test-setup-py3.py

      - name: 中继队列（Durable Object）逻辑测试
        run: |
          set -o pipefail
          # 直接 import 真实的 remote/relay/worker.js，用假 storage 验队列语义：
          # 取走即删、先进先出、序号只增、鉴权 fail-closed。
          # 需要 Cloudflare 账号的那一步（wrangler dev --local / deploy）CI 里跑不了。
          node scripts/test-relay-do.mjs

      - name: 平台端到端（自造凭据：验签 / AES / 白名单 / 回推）
        run: |
          set -o pipefail
          # 不需要任何真实 token：EncodingAESKey、回调 Token、Encrypt Key 全是现场生成的。
          python3 scripts/test-platform.py

      - name: 命令可达性审计（12 条命令 × 路由/真切换 两相）
        run: |
          set -o pipefail
          # 用 PTY 真喂命令（管道会把多行读成一整块，测出来全是默认厂商）。
          # 这条以前只在本地手工跑，等于没有防线：别名被删/改坏没人会发现。
          python3 scripts/audit-commands.py

      - name: 版本与文档数字防漂移
        run: |
          set -o pipefail
          # 版本号只有一个来源（VERSION 文件）；文档里写的条数必须对得上实际。
          python3 scripts/check-version.py -v

      - name: 发布流水线验证（非 macOS 部分）
        run: |
          set -o pipefail
          # 取 release.yml 里的 run: 原文在本机真跑：版本解析、产物校验的正负例。
          # py2app 打包与 gh release 只能在 macOS runner 上验，本机跳过。
          python3 scripts/test-release-workflow.py

      - name: 泄漏检查（密钥 / 令牌 / 本机路径 / 个人标识）
        run: |
          set -o pipefail
          # 仓库是公开 fork：任何一次带 key 的提交都等于公开。
          # 这条卡口的价值在于"挡住下一次"，而不是补救这一次。
          python3 scripts/check-secrets.py

      - name: 编码与换行检查
        run: |
          set -o pipefail
          # 用 perl 而不是 grep -U：macOS 上是 BSD grep，不认 -U
          BAD=0
          for f in $(git ls-files | grep -vE '\.(png|icns)$'); do
            # 先判存在：打不开文件时原来会被报成「含 CRLF」，那是假原因
            # （文件被 mv 掉、索引没同步时就会这样，会让人去查换行符）
            [ -f "$f" ] || { echo "::error::$f 在索引里但工作区不存在 —— 先 git add -A 同步索引"; BAD=1; continue; }
            if perl -e 'exit((do { local $/; open my $h, "<:raw", $ARGV[0] or exit 2; my $c = <$h>; $c =~ /\r/ }) ? 1 : 0)' "$f"; then
              : # 无 CR
            else
              echo "::error::$f 含 CRLF，编辑器约定是 LF"
              BAD=1
            fi
          done
          [ "$BAD" -eq 0 ] || exit 1
          echo "无 CRLF"
